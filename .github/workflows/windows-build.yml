# GitHub Actions workflow to build a Windows .exe for Electron app
# Place this file at .github/workflows/windows-build.yml

name: Build Electron Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build-win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install dependencies
        run: npm install
      - name: Build Windows EXE (electron-builder)
        run: npm run dist -- --win
      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: electron-windows-build
          path: |
            release/*.exe
            dist/*.exe
            dist/*.msi
            dist/*.zip
